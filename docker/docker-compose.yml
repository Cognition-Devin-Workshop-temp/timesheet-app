version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set and at least 32 characters}
      - CSRF_SECRET=${CSRF_SECRET:?CSRF_SECRET must be set}
      - DATABASE_PATH=/app/data/timesheet.db
    volumes:
      - timesheet-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  timesheet-data:
    driver: local
