name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  ci:
    name: Run CI checks
    uses: ./.github/workflows/ci.yml

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [ci]
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: meta
        run: |
          TAG="${{ github.sha }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        run: |
          IMAGE_URI="${{ secrets.ECR_REPOSITORY_URL }}:${{ steps.meta.outputs.tag }}"
          docker build -f docker/Dockerfile -t "$IMAGE_URI" .
          docker tag "$IMAGE_URI" "${{ secrets.ECR_REPOSITORY_URL }}:latest"
          docker push "$IMAGE_URI"
          docker push "${{ secrets.ECR_REPOSITORY_URL }}:latest"

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [build-and-push]
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get EC2 Instance ID
        id: ec2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=client-timesheet-app" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSM Run Command
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.ec2.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands='["sudo /opt/app/deploy.sh"]' \
            --query 'Command.CommandId' \
            --output text)
          echo "Waiting for deployment command $COMMAND_ID..."
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.ec2.outputs.instance_id }}" || true
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ steps.ec2.outputs.instance_id }}" \
            --query 'Status' \
            --output text)
          echo "Deployment status: $STATUS"
          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed!"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ steps.ec2.outputs.instance_id }}" \
              --query 'StandardErrorContent' \
              --output text
            exit 1
          fi

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: [deploy]
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Get Elastic IP
        id: ip
        run: |
          IP=$(aws ec2 describe-addresses \
            --filters "Name=tag:Name,Values=client-timesheet-app" \
            --query 'Addresses[0].PublicIp' \
            --output text)
          echo "ip=$IP" >> "$GITHUB_OUTPUT"

      - name: Wait for application to be healthy
        run: |
          echo "Checking health at http://${{ steps.ip.outputs.ip }}/health"
          for i in $(seq 1 30); do
            if curl -sf "http://${{ steps.ip.outputs.ip }}/health" > /dev/null 2>&1; then
              echo "Application is healthy!"
              exit 0
            fi
            echo "Attempt $i/30 - waiting..."
            sleep 10
          done
          echo "Health check failed after 30 attempts"
          exit 1
